<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TanksBlik · Дневник отметок PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg: #08020f;
    --panel: rgba(var(--s3), 0.62);
    --text: #f6ecff;
    --muted: #b89ad6;
    --purple: #b45cff;
    --purple-2: #d09aff;
    --purple-3: #f0d8ff;
    --violet: #8b2fd6;
    --magenta: #e040fb;
    --pink: #ff6ec7;
    --green: #4ade80;
    --red: #f87171;
    --radius: 26px;
    --c1: 180,92,255;
    --c2: 208,154,255;
    --c3: 139,47,214;
    --c4: 224,64,251;
    --c5: 255,110,199;
    --s0: 8,2,15;
    --s1: 18,6,32;
    --s2: 13,4,24;
    --s3: 24,8,40;
    --s4: 48,30,70;
    --k1: 27,11,49;
    --k2: 12,3,22;
    --ph: #5a3d7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 40px clamp(16px, 4vw, 64px) 100px;
    font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ПРИВЕТСТВИЕ */
  #welcome { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(5,1,10,.94); backdrop-filter: blur(16px); transition: opacity .5s, transform .5s; }
  #welcome.leave { opacity: 0; pointer-events: none; transform: scale(1.1); }
  .w-box { width: min(560px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; }
  .w-title { margin: 0; font-size: 3rem; font-weight: 700; background: linear-gradient(120deg, #fff, var(--purple-3), var(--magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .w-input { padding: 16px 20px; width: 100%; max-width: 380px; margin: 20px 0; border-radius: 16px; background: rgba(var(--s0),.7); border: 1px solid var(--purple); color: #fff; font-family: inherit; outline: none; text-align: center; }
  .w-btn { padding: 18px; width: 100%; max-width: 380px; border-radius: 16px; background: linear-gradient(135deg, var(--purple-2), var(--violet)); border: none; color: #fff; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.3s; }
  .w-btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--purple); }

  /* ОСНОВА */
  .wrap { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; display: none; }
  .wrap.show { display: block; animation: riseIn 0.5s; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* ШАПКА И ВКЛАДКИ */
  header { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .logo { width: 66px; height: 66px; border-radius: 21px; background: linear-gradient(135deg, var(--purple-2), var(--violet)); display: grid; place-items: center; font-size: 30px; box-shadow: 0 0 44px rgba(var(--c1),.9); }
  header h1 { font-size: 2rem; margin: 0; font-weight: 700; background: linear-gradient(120deg, #fff 0%, var(--purple-3) 30%, var(--magenta) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
  .tab { padding: 12px 24px; border-radius: 14px; border: none; cursor: pointer; font-weight: 700; color: var(--muted); background: rgba(var(--s3),.6); }
  .tab.active { color: #fff; background: var(--purple); box-shadow: 0 0 30px rgba(var(--c1),.5); }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: riseIn 0.5s; }

  /* КАРТОЧКИ */
  .card { position: relative; background: rgba(20,10,35,0.8); border: 1px solid rgba(var(--c1),0.3); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .card h2 { margin-top: 0; color: var(--purple-2); font-size: 1.2rem; }
  .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 22px; }
  input { width: 100%; padding: 14px 16px; border-radius: 14px; background: rgba(var(--s0),.82); border: 1px solid rgba(var(--c1),.28); color: #fff; outline: none; margin-bottom: 10px; font-family: "JetBrains Mono", monospace; }
  input:focus { border-color: var(--purple); box-shadow: 0 0 0 4px rgba(var(--c1),.15); }
  .btn { padding: 15px 26px; border-radius: 16px; background: linear-gradient(135deg, var(--purple-2), var(--violet)); color: #fff; border: none; cursor: pointer; font-weight: 700; transition: 0.3s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(var(--c1),.65); }

  /* ШАШКИ */
  .checkers-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
  #checkersBoard { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 100%; max-width: 400px; aspect-ratio: 1; background: rgba(var(--c1),.2); padding: 4px; border-radius: 12px; }
  .cell { position: relative; background: rgba(30,15,50,0.8); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cell.dark { background: rgba(10,5,20,0.8); }
  .cell.selected { box-shadow: inset 0 0 0 3px var(--pink); }
  .piece { width: 70%; height: 70%; border-radius: 50%; }
  .piece.white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); box-shadow: 0 0 10px rgba(255,255,255,.8); }
  .piece.black { background: radial-gradient(circle at 30% 30%, #666, #222); box-shadow: 0 0 10px rgba(0,0,0,.8); }
  .piece.king::after { content: '👑'; position: absolute; font-size: 14px; }

  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ПРИВЕТСТВИЕ -->
<div id="welcome">
  <h1 class="w-title">TanksBlik</h1>
  <p style="color:var(--muted);">Дневник отметок PRO</p>
  <input type="text" id="wName" class="w-input" placeholder="Как тебя зовут?" maxlength="24">
  <button id="wEnter" class="w-btn">Войти</button>
</div>

<!-- ОСНОВНОЙ САЙТ (СКРЫТ ПОКА НЕ ВОЙДЕШЬ) -->
<div class="wrap" id="mainWrap">
  <div class="header" style="display:flex; align-items:center; gap:15px; margin-bottom:30px;">
    <div class="logo">★</div>
    <h1>TanksBlik · Дневник отметок</h1>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="calc">Калькулятор</button>
    <button class="tab" data-tab="checkers">Шашки</button>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <div class="tab-content active" id="tab-calc">
    <div class="card">
      <h2>Твой средний урон</h2>
      <h1 id="avgValue" style="font-size: 4rem; margin: 0;">0</h1>
    </div>
    <div class="grid">
      <div class="card">
        <h2>Исходные данные</h2>
        <input type="number" id="baseAvg" placeholder="Средний урон (0)">
        <button class="btn" onclick="updateCalc()">Обновить</button>
      </div>
      <div class="card">
        <h2>Добавить бой</h2>
        <input type="number" id="dmg" placeholder="Урон за бой">
        <button class="btn" onclick="addBattle()">+</button>
      </div>
    </div>
  </div>

  <!-- ШАШКИ -->
  <div class="tab-content" id="tab-checkers">
    <div class="card">
      <h2>Шашки</h2>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button class="btn" onclick="startOnlineGame()">🌐 Онлайн</button>
        <button class="btn" onclick="startLocalGame()">👥 Локально</button>
        <button class="btn" onclick="startAIGame()">🤖 С ИИ</button>
      </div>
      <div class="checkers-wrap">
        <div id="checkersBoard"></div>
        <div style="margin-top: 15px; font-weight: bold; color: var(--pink);" id="checkersStatus">Выбери режим</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ ПРИВЕТСТВИЕ ============ */
document.getElementById('wEnter').addEventListener('click', function() {
    document.getElementById('welcome').classList.add('leave');
    document.getElementById('mainWrap').classList.add('show');
});

/* ============ ВКЛАДКИ ============ */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

/* ============ КАЛЬКУЛЯТОР ============ */
let history = [];
function updateCalc() {
  const avg = +document.getElementById('baseAvg').value || 0;
  document.getElementById('avgValue').textContent = avg;
}
function addBattle() {
  const dmg = +document.getElementById('dmg').value;
  if(dmg > 0) {
    history.push(dmg);
    const sum = history.reduce((a, b) => a + b, 0);
    const avg = Math.round(sum / history.length);
    document.getElementById('avgValue').textContent = avg;
    document.getElementById('dmg').value = '';
  }
}

/* ============ ЛОГИКА ШАШЕК ============ */
let socket = null;
let myColor = null;
let currentRoomId = null;
let gameMode = 'local';
let checkersBoard = [];
let selectedCell = null;
let checkersTurn = 'white';

// ТВОЯ ССЫЛКА С ЦИФРОЙ 1 (ПРОВЕРЬ, ЧТО ОНА ТАКАЯ)
const SERVER_URL = "https://server-checkers-r1te.onrender.com"; 

function connectToServer() {
    if (socket) return;
    socket = io(SERVER_URL);

    socket.on('waiting_for_opponent', () => {
        document.getElementById('checkersStatus').textContent = "Ожидание соперника...";
        document.getElementById('checkersStatus').style.color = "var(--pink)";
    });

    socket.on('game_start', (data) => {
        myColor = data.color;
        currentRoomId = data.roomId;
        initCheckers();
        document.getElementById('checkersStatus').textContent = `Игра! Ты: ${myColor === 'white' ? 'Белые' : 'Чёрные'}`;
        document.getElementById('checkersStatus').style.color = "var(--green)";
        checkersTurn = 'white';
        renderCheckers();
    });

    socket.on('opponent_moved', (data) => {
        applyMove(data.from, data.to);
        checkersTurn = myColor;
        renderCheckers();
        document.getElementById('checkersStatus').textContent = "Твой ход!";
    });

    socket.on('opponent_disconnected', () => {
        alert("Соперник отключился.");
        initCheckers();
    });
}

function startOnlineGame() {
    gameMode = 'online';
    if (!socket) connectToServer();
    const name = prompt("Твоё имя:") || "Игрок";
    socket.emit('find_game', name);
    document.getElementById('checkersStatus').textContent = "Поиск игры...";
}

function startLocalGame() {
    gameMode = 'local';
    initCheckers();
    document.getElementById('checkersStatus').textContent = "Локальная игра";
}

function startAIGame() {
    gameMode = 'ai';
    initCheckers();
    document.getElementById('checkersStatus').textContent = "Игра с ИИ";
}

function initCheckers() {
  checkersBoard = Array(8).fill(null).map(() => Array(8).fill(null));
  selectedCell = null;
  checkersTurn = 'white';
  for(let r=5; r<8; r++) for(let c=0; c<8; c++) if((r+c)%2 !== 0) checkersBoard[r][c] = 'white';
  for(let r=0; r<3; r++) for(let c=0; c<8; c++) if((r+c)%2 !== 0) checkersBoard[r][c] = 'black';
  renderCheckers();
}

function renderCheckers() {
  const container = document.getElementById('checkersBoard');
  if(!container) return;
  container.innerHTML = '';
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r+c)%2 === 0 ? '' : 'dark');
      if(selectedCell && selectedCell.r === r && selectedCell.c === c) cell.classList.add('selected');
      const piece = checkersBoard[r][c];
      if(piece) {
        const p = document.createElement('div');
        p.className = 'piece ' + piece.split('-')[0];
        if(piece.includes('king')) p.classList.add('king');
        cell.appendChild(p);
      }
      cell.onclick = () => clickCell(r, c);
      container.appendChild(cell);
    }
  }
}

function applyMove(from, to) {
    const piece = checkersBoard[from.r][from.c];
    if (!piece) return;
    checkersBoard[to.r][to.c] = piece;
    checkersBoard[from.r][from.c] = null;
    if (Math.abs(to.r - from.r) === 2) {
        const mr = from.r + (to.r - from.r) / 2;
        const mc = from.c + (to.c - from.c) / 2;
        checkersBoard[mr][mc] = null;
    }
    if (to.r === 0 && piece.startsWith('black')) checkersBoard[to.r][to.c] += '-king';
    if (to.r === 7 && piece.startsWith('white')) checkersBoard[to.r][to.c] += '-king';
}

function clickCell(r, c) {
    if (gameMode === 'online' && checkersTurn !== myColor) return;
    const piece = checkersBoard[r][c];
    if(piece && piece.startsWith(checkersTurn)) {
        selectedCell = {r, c};
        renderCheckers();
        return;
    }
    if(selectedCell) {
        const from = selectedCell;
        const dr = r - from.r;
        const dc = c - from.c;
        const pieceType = checkersBoard[from.r][from.c];
        const isKing = pieceType.includes('king');
        let valid = false;
        if(Math.abs(dr) === 1 && Math.abs(dc) === 1 && !piece) {
            if(isKing || (checkersTurn === 'white' && dr === -1) || (checkersTurn === 'black' && dr === 1)) valid = true;
        }
        if(Math.abs(dr) === 2 && Math.abs(dc) === 2 && !piece) {
            const mr = from.r + dr/2, mc = from.c + dc/2;
            const enemy = checkersBoard[mr][mc];
            if(enemy && !enemy.startsWith(checkersTurn)) {
                if(isKing || (checkersTurn === 'white' && dr === -2) || (checkersTurn === 'black' && dr === 2)) valid = true;
            }
        }
        if (valid) {
            applyMove(from, {r, c});
            if (gameMode === 'online') {
                socket.emit('make_move', { roomId: currentRoomId, from, to: {r, c} });
            } else if (gameMode === 'ai' && checkersTurn === 'white') {
                setTimeout(makeAIMove, 500);
            }
            checkersTurn = checkersTurn === 'white' ? 'black' : 'white';
            selectedCell = null;
            renderCheckers();
        } else {
            selectedCell = null;
            renderCheckers();
        }
    }
}

function makeAIMove() {
    if (checkersTurn !== 'black' || gameMode !== 'ai') return;
    let validMoves = [];
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const piece = checkersBoard[r][c];
            if (piece && piece.startsWith('black')) {
                const dirs = piece.includes('king') ? [-1, 1] : [1];
                for (const dr of dirs) {
                    for (const dc of [-1, 1]) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !checkersBoard[nr][nc]) {
                            validMoves.push({ from: {r, c}, to: {r: nr, c: nc} });
                        }
                    }
                }
                for (const dr of [-2, 2]) {
                    for (const dc of [-2, 2]) {
                        const nr = r + dr, nc = c + dc;
                        const mr = r + dr/2, mc = c + dc/2;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !checkersBoard[nr][nc]) {
                            const enemy = checkersBoard[mr][mc];
                            if (enemy && enemy.startsWith('white')) {
                                validMoves.push({ from: {r, c}, to: {r: nr, c: nc} });
                            }
                        }
                    }
                }
            }
        }
    }
    if (validMoves.length === 0) return;
    const move = validMoves[Math.floor(Math.random() * validMoves.length)];
    applyMove(move.from, move.to);
    checkersTurn = 'white';
    renderCheckers();
}

// Инициализация при загрузке
initCheckers();
</script>
</body>
</html>
