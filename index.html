<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanks Blitz · Дневник отметок PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- Подключаем Socket.IO для онлайн-шашек -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>  /* ФОН */
  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; filter: blur(90px); opacity: 0.8; }
  .aurora::before, .aurora::after { content: ''; position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; background: radial-gradient(circle, rgba(var(--c3),.6) 0%, rgba(var(--c4),.3) 40%, transparent 70%); animation: auroraSpin 26s linear infinite; top: -30vmax; left: -30vmax; }
  .aurora::after { background: radial-gradient(circle, rgba(var(--c5),.35) 0%, rgba(var(--c1),.28) 40%, transparent 70%); animation-duration: 36s; animation-direction: reverse; top: auto; bottom: -30vmax; right: -30vmax; left: auto; }
  @keyframes auroraSpin { to { transform: rotate(360deg); } }
  #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #cursorGlow { position: fixed; top: 0; left: 0; width: 700px; height: 700px; border-radius: 50%; pointer-events: none; z-index: 1; background: radial-gradient(circle, rgba(var(--c2),.34) 0%, rgba(var(--c3),.15) 35%, transparent 70%); transform: translate(-50%, -50%); filter: blur(40px); transition: opacity .6s ease; will-change: transform; mix-blend-mode: screen; }
  .wrap { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; }

  @keyframes riseIn { from { opacity: 0; transform: translateY(30px) scale(.97); filter: blur(12px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

  /* КАРТОЧКИ */
  .card { position: relative; background: var(--panel); border-radius: var(--radius); padding: clamp(20px, 2.4vw, 30px); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); box-shadow: 0 24px 70px rgba(0,0,0,.75), 0 0 50px rgba(var(--c3),.2), inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 50px rgba(var(--c1),.06); animation: riseIn 1s cubic-bezier(.22,1,.36,1) both; transition: transform .8s cubic-bezier(.22,1,.36,1), box-shadow .8s ease; overflow: hidden; isolation: isolate; }
  .card::before { content: ''; position: absolute; inset: -2px; border-radius: calc(var(--radius) + 2px); background: conic-gradient(from var(--angle, 0deg), rgba(var(--c1),.95), rgba(var(--c4),.85), rgba(var(--c5),.85), rgba(var(--c2),.95), rgba(var(--c1),.95)); z-index: -2; opacity: .65; animation: rotateBorder 8s linear infinite; transition: opacity .8s ease; }
  .card::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius); background: linear-gradient(180deg, #1a0a2e, #0d0418); z-index: -1; }
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes rotateBorder { to { --angle: 360deg; } }
  .card:hover { transform: translateY(-5px); box-shadow: 0 34px 100px rgba(0,0,0,.85), 0 0 110px rgba(var(--c1),.45), inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 80px rgba(var(--c1),.12); }
  .card:hover::before { opacity: 1; }
  .card > * { position: relative; z-index: 1; }

  header { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; animation: riseIn 1s cubic-bezier(.22,1,.36,1) both; }
  .logo-wrap { position: relative; width: 66px; height: 66px; }
  .logo-ring { position: absolute; inset: -7px; border-radius: 24px; background: conic-gradient(from 0deg, transparent, var(--purple-2), var(--magenta), var(--pink), transparent 70%); filter: blur(10px); animation: rotateBorder 5s linear infinite; opacity: .9; }
  .logo { width: 66px; height: 66px; border-radius: 21px; background: linear-gradient(135deg, var(--purple-2), var(--violet)); display: grid; place-items: center; font-size: 30px; box-shadow: 0 0 44px rgba(var(--c1),.9), inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 24px rgba(255,255,255,.12); position: relative; animation: glowPulse 3.5s ease-in-out infinite; }
  @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 44px rgba(var(--c1),.8), inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 24px rgba(255,255,255,.1); } 50% { box-shadow: 0 0 80px rgba(var(--c2),1), inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 36px rgba(255,255,255,.18); } }
  header h1 { font-size: clamp(1.5rem, 2.4vw, 2rem); margin: 0; font-weight: 700; letter-spacing: -.035em; background: linear-gradient(120deg, #fff 0%, var(--purple-3) 30%, var(--purple-2) 60%, var(--magenta) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 34px rgba(var(--c2),.7)); background-size: 200% 100%; animation: textFlow 7s ease infinite; }
  @keyframes textFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  header p { margin: 5px 0 0; font-size: .85rem; color: var(--muted); font-weight: 500; letter-spacing: .03em; }

  /* ВКЛАДКИ */
  .tabs { display: flex; gap: 10px; margin-bottom: 22px; animation: riseIn 1s cubic-bezier(.22,1,.36,1) both; animation-delay: .05s; }
  .tab { padding: 12px 24px; border-radius: 14px; border: none; cursor: pointer; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: .92rem; color: var(--muted); background: rgba(var(--s3),.6); box-shadow: inset 0 0 0 1px rgba(var(--c1),.25); transition: all .5s cubic-bezier(.22,1,.36,1); position: relative; overflow: hidden; }
  .tab::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--purple-2), var(--violet)); opacity: 0; transition: opacity .4s ease; z-index: -1; }
  .tab:hover { color: var(--purple-2); transform: translateY(-2px); }
  .tab.active { color: #fff; box-shadow: inset 0 0 0 1px var(--purple-2), 0 0 30px rgba(var(--c1),.5), 0 6px 24px rgba(var(--c3),.4); }
  .tab.active::before { opacity: 1; }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: riseIn .7s cubic-bezier(.22,1,.36,1) both; }

  .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 22px; }
  .card.full { grid-column: 1 / -1; }

  .card h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .2em; color: var(--purple-2); margin: 0 0 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; text-shadow: 0 0 18px rgba(var(--c2),.8); }
  .card h2::before { content: ''; width: 5px; height: 18px; border-radius: 4px; background: linear-gradient(180deg, var(--purple-2), var(--violet)); box-shadow: 0 0 20px rgba(var(--c1),1), 0 0 6px rgba(255,255,255,.9); }

  .hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
  .avg-block { display: flex; flex-direction: column; gap: 10px; }
  .avg-label { font-size: .82rem; color: var(--muted); font-weight: 500; letter-spacing: .05em; }
  .avg-value { font-family: "JetBrains Mono", monospace; font-size: clamp(3.6rem, 8.5vw, 6.4rem); font-weight: 700; line-height: .95; letter-spacing: -.045em; background: linear-gradient(180deg, #fff 0%, var(--purple-3) 30%, var(--purple-2) 70%, var(--violet) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 40px rgba(var(--c1),.85)) drop-shadow(0 0 80px rgba(var(--c1),.4)); transition: transform .6s cubic-bezier(.22,1,.36,1), filter .6s ease; position: relative; }
  .avg-value.pop { transform: scale(1.07); filter: drop-shadow(0 0 70px rgba(var(--c2),1)) drop-shadow(0 0 120px rgba(var(--c1),.75)); }
  .avg-sub { font-size: .9rem; color: var(--muted); font-weight: 500; }
  .avg-sub .ok { color: var(--green); text-shadow: 0 0 22px rgba(74,222,128,1); }

  .side { display: flex; flex-direction: column; gap: 12px; min-width: 230px; }
  .pill { position: relative; background: rgba(var(--s2),.78); border-radius: 16px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 20px; box-shadow: inset 0 0 24px rgba(var(--c1),.09), 0 0 0 1px rgba(var(--c1),.28); transition: transform .6s cubic-bezier(.22,1,.36,1), box-shadow .6s ease; overflow: hidden; }
  .pill::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(120deg, transparent, rgba(var(--c2),.22), transparent); transform: translateX(-100%); transition: transform 1s cubic-bezier(.22,1,.36,1); }
  .pill:hover::before { transform: translateX(100%); }
  .pill:hover { transform: translateX(-5px); box-shadow: inset 0 0 34px rgba(var(--c1),.22), 0 0 0 1px rgba(var(--c2),.65), 0 0 44px rgba(var(--c1),.45); }
  .pill .k { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .pill .v { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.12rem; color: var(--purple-3); text-shadow: 0 0 22px rgba(var(--c2),1); }

  .progress-wrap { margin-top: 30px; }
  .progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-size: .88rem; font-weight: 600; }
  .progress-head .pct { font-family: "JetBrains Mono", monospace; color: var(--purple-2); font-size: 1.12rem; text-shadow: 0 0 24px rgba(var(--c2),1); }
  .bar { height: 22px; border-radius: 999px; background: rgba(var(--s0),.98); overflow: hidden; position: relative; padding: 3px; box-shadow: inset 0 4px 14px rgba(0,0,0,.95), 0 0 0 1px rgba(var(--c1),.38), 0 0 34px rgba(var(--c1),.28); transition: box-shadow .7s ease; }
  .bar:hover { box-shadow: inset 0 4px 14px rgba(0,0,0,.95), 0 0 0 1px rgba(var(--c2),.75), 0 0 56px rgba(var(--c1),.6); }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--violet), var(--purple), var(--purple-2), var(--magenta), var(--pink)); background-size: 300% 100%; border-radius: 999px; transition: width 1.5s cubic-bezier(.22,1,.36,1); box-shadow: 0 0 40px rgba(var(--c1),1), 0 0 90px rgba(var(--c1),.65), inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 16px rgba(255,255,255,.4); position: relative; animation: gradientShift 4s ease infinite; }
  @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .bar-fill::after { content: ''; position: absolute; inset: 0; border-radius: 999px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: shimmer 2.6s ease-in-out infinite; }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .bar-fill.done { background: linear-gradient(90deg, #16a34a, var(--green), #a7f3d0); box-shadow: 0 0 40px rgba(74,222,128,1), 0 0 90px rgba(74,222,128,.65), inset 0 1px 0 rgba(255,255,255,.6); }
  .bar-meta { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-top: 10px; font-weight: 500; font-family: "JetBrains Mono", monospace; }

  .needed { margin-top: 24px; padding: 22px 24px; background: linear-gradient(135deg, rgba(var(--c3),.14), rgba(var(--c4),.08)); border-radius: 20px; font-size: .95rem; line-height: 1.6; font-weight: 500; transition: all .7s ease; position: relative; overflow: hidden; box-shadow: 0 0 0 1px rgba(var(--c1),.5), 0 0 44px rgba(var(--c1),.22), inset 0 0 44px rgba(var(--c1),.07); }
  .needed::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(500px 120px at 0% 50%, rgba(var(--c1),.28), transparent 70%); }
  .needed .num { font-family: "JetBrains Mono", monospace; font-size: 2.1rem; font-weight: 700; color: var(--purple-2); text-shadow: 0 0 34px rgba(var(--c2),1), 0 0 70px rgba(var(--c1),.65); }
  .needed.ok { box-shadow: 0 0 0 1px rgba(74,222,128,.6), 0 0 44px rgba(74,222,128,.28), inset 0 0 44px rgba(74,222,128,.07); background: rgba(74,222,128,.07); }
  .needed.ok .num { color: var(--green); text-shadow: 0 0 34px rgba(74,222,128,1), 0 0 70px rgba(74,222,128,.65); }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .field label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: 9px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  input[type="number"], select, input[type="text"] { width: 100%; padding: 14px 16px; background: rgba(var(--s0),.82); border: none; border-radius: 14px; color: var(--text); font-size: 1rem; font-weight: 600; outline: none; font-family: "JetBrains Mono", monospace; box-shadow: inset 0 0 0 1px rgba(var(--c1),.28), inset 0 2px 6px rgba(0,0,0,.4); transition: box-shadow .5s ease, background .5s ease; cursor: pointer; }
  input[type="number"]:focus, select:focus, input[type="text"]:focus { background: rgba(var(--s0),1); box-shadow: inset 0 0 0 1px var(--purple), inset 0 2px 6px rgba(0,0,0,.4), 0 0 0 4px rgba(var(--c1),.15), 0 0 32px rgba(var(--c1),.55); }
  input::placeholder { color: var(--ph); font-weight: 500; }
  select option { background: rgb(var(--k1)); color: var(--text); }

  .add-row { display: flex; gap: 16px; align-items: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .add-row .field { flex: 1; min-width: 200px; }

  .btn { padding: 15px 26px; border: none; border-radius: 14px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: .95rem; cursor: pointer; white-space: nowrap; letter-spacing: .02em; transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .5s ease, background .5s ease, color .5s ease; position: relative; overflow: hidden; }
  .btn:active { transform: scale(.96); }
  .btn-primary { background: linear-gradient(135deg, var(--purple-2), var(--violet)); color: #fff; box-shadow: 0 10px 40px rgba(var(--c1),.65), 0 0 0 1px rgba(var(--c2),.65), 0 0 28px rgba(var(--c1),.55), inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 20px rgba(255,255,255,.1); }
  .btn-primary:hover { box-shadow: 0 16px 56px rgba(var(--c1),.95), 0 0 0 1px rgba(255,255,255,.75), 0 0 70px rgba(var(--c2),.85), inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 30px rgba(255,255,255,.15); transform: translateY(-3px); }
  .btn-primary::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-100%); transition: transform .7s cubic-bezier(.22,1,.36,1); }
  .btn-primary:hover::before { transform: translateX(100%); }
  .btn-ghost { background: rgba(var(--s3),.75); color: var(--muted); box-shadow: inset 0 0 0 1px rgba(var(--c1),.28); }
  .btn-ghost:hover { color: var(--purple-2); box-shadow: inset 0 0 0 1px var(--purple), 0 0 32px rgba(var(--c1),.4); transform: translateY(-2px); }
  .btn-ghost.danger:hover { color: var(--red); box-shadow: inset 0 0 0 1px var(--red), 0 0 32px rgba(248,113,113,.45); }
  .toolbar { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }

  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .history-head h2 { margin: 0; }
  .badge { font-family: "JetBrains Mono", monospace; font-size: .74rem; padding: 6px 14px; border-radius: 999px; background: rgba(var(--c1),.16); color: var(--purple-2); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(var(--c2),.55), 0 0 18px rgba(var(--c1),.45); text-shadow: 0 0 14px rgba(var(--c2),.9); animation: badgePulse 3.5s ease-in-out infinite; }
  @keyframes badgePulse { 0%, 100% { box-shadow: inset 0 0 0 1px rgba(var(--c2),.55), 0 0 18px rgba(var(--c1),.45); } 50% { box-shadow: inset 0 0 0 1px rgba(var(--c2),.85), 0 0 32px rgba(var(--c1),.75); } }
  .scroll { max-height: 420px; overflow-y: auto; border-radius: 16px; scroll-behavior: smooth; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--violet), var(--purple)); border-radius: 8px; box-shadow: 0 0 12px rgba(var(--c1),.9); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  thead th { position: sticky; top: 0; z-index: 1; background: rgba(var(--s1),.98); backdrop-filter: blur(12px); color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; padding: 14px; text-align: left; box-shadow: inset 0 -1px 0 rgba(var(--c1),.32); }
  tbody td { padding: 12px 14px; border-bottom: 1px solid rgba(var(--c1),.12); transition: background .4s ease; }
  tbody tr { transition: background .4s ease, transform .4s ease; animation: rowIn .6s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
  tbody tr:hover { background: rgba(var(--c1),.09); }
  tbody tr:last-child td { border-bottom: none; }
  .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 8px; font-family: "JetBrains Mono", monospace; font-size: .74rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tag.up { color: var(--green); background: rgba(74,222,128,.12); box-shadow: inset 0 0 0 1px rgba(74,222,128,.4), 0 0 16px rgba(74,222,128,.32); }
  .tag.down { color: var(--red); background: rgba(248,113,113,.12); box-shadow: inset 0 0 0 1px rgba(248,113,113,.4), 0 0 16px rgba(248,113,113,.32); }
  .tag.flat { color: var(--muted); background: rgba(var(--s4),.5); box-shadow: inset 0 0 0 1px rgba(var(--c1),.22); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: .9rem; font-weight: 500; }

  .scenarios { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .scenario { position: relative; background: rgba(var(--s1),.72); border-radius: 16px; padding: 16px 18px; box-shadow: inset 0 0 0 1px rgba(var(--c1),.28), 0 0 22px rgba(var(--c1),.09); transition: transform .5s cubic-bezier(.22,1,.36,1), box-shadow .5s ease; overflow: hidden; }
  .scenario::before { content: ''; position: absolute; inset: 0; background: radial-gradient(220px 90px at 50% 0%, rgba(var(--c1),.16), transparent 70%); pointer-events: none; }
  .scenario:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 1px var(--purple-2), 0 0 40px rgba(var(--c1),.45); }
  .scenario .s-label { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 8px; }
  .scenario .s-value { font-family: "JetBrains Mono", monospace; font-size: 1.6rem; font-weight: 700; color: var(--purple-2); text-shadow: 0 0 22px rgba(var(--c2),.8); }
  .scenario .s-sub { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .scenario.best { box-shadow: inset 0 0 0 1px rgba(74,222,128,.6), 0 0 44px rgba(74,222,128,.32); }
  .scenario.best .s-value { color: var(--green); text-shadow: 0 0 22px rgba(74,222,128,.85); }

  /* МИНИ-ИГРА */
  .game-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
  #gameCanvas { width: 100%; max-width: 900px; height: 420px; border-radius: 20px; cursor: crosshair; box-shadow: inset 0 0 0 1px rgba(var(--c1),.45), 0 0 44px rgba(var(--c1),.25); background: radial-gradient(circle at 50% 50%, rgba(var(--c3),.18), rgba(var(--s0),.95)); transition: box-shadow .6s ease; }
  #gameCanvas:hover { box-shadow: inset 0 0 0 1px rgba(var(--c2),.75), 0 0 60px rgba(var(--c1),.45); }
  .game-stats { display: flex; gap: 24px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .game-stat { background: rgba(var(--s1),.72); border-radius: 14px; padding: 12px 22px; box-shadow: inset 0 0 0 1px rgba(var(--c1),.28), 0 0 22px rgba(var(--c1),.1); text-align: center; }
  .game-stat .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  .game-stat .v { font-family: "JetBrains Mono", monospace; font-size: 1.5rem; font-weight: 700; color: var(--purple-2); text-shadow: 0 0 22px rgba(var(--c2),.8); }

  /* ШАШКИ */
  .checkers-wrap { display: flex; flex-direction: column; align-items: center; }
  #checkersBoard { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 100%; max-width: 400px; aspect-ratio: 1; background: rgba(var(--c1),.2); padding: 4px; border-radius: 12px; margin-top: 20px; }
  .cell { position: relative; background: rgba(var(--s1),.8); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .3s; }
  .cell.dark { background: rgba(var(--s0),.8); }
  .cell.selected { box-shadow: inset 0 0 0 3px var(--pink); }
  .piece { width: 70%; height: 70%; border-radius: 50%; transition: transform .3s cubic-bezier(.22,1,.36,1); }
  .piece.white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); box-shadow: 0 0 15px rgba(255,255,255,.8); }
  .piece.black { background: radial-gradient(circle at 30% 30%, #666, #222); box-shadow: 0 0 15px rgba(0,0,0,.8); }
  .piece.king::after { content: '👑'; position: absolute; font-size: 16px; }

  /* АНТИСТРЕСС */
  .anti-stress { position: fixed; right: 28px; bottom: 28px; z-index: 50; width: 78px; height: 78px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, var(--purple-2), var(--violet)); display: grid; place-items: center; font-size: 34px; color: #fff; box-shadow: 0 0 0 2px rgba(var(--c2),.75), 0 0 44px rgba(var(--c1),.75), inset 0 2px 0 rgba(255,255,255,.4); transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .5s ease; animation: antiPulse 4s ease-in-out infinite; }

  /* ===== v5: темы ===== */
  :root { --c1: 180,92,255; --c2: 208,154,255; --c3: 139,47,214; --c4: 224,64,251; --c5: 255,110,199; --s0: 8,2,15; --s1: 18,6,32; --s2: 13,4,24; --s3: 24,8,40; --s4: 48,30,70; --k1: 27,11,49; --k2: 12,3,22; --ph: #5a3d7a; --purple: rgb(var(--c1)); --purple-2: rgb(var(--c2)); --violet: rgb(var(--c3)); --magenta: rgb(var(--c4)); --pink: rgb(var(--c5)); }

  @media (max-width: 900px) { .dock { left: 16px; bottom: 16px; } .dock-btn { width: 56px; height: 56px; font-size: 24px; } .links { grid-template-columns: repeat(3, 1fr); } }
  :focus-visible { outline: 2px solid var(--purple-2); outline-offset: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
  #spark { display: block; width: 100%; max-width: 420px; height: 72px; margin-top: 8px; overflow: visible; filter: drop-shadow(0 0 10px rgba(var(--c1),.55)); }
  .spark-cap { font-size: .72rem; color: var(--muted); font-family: "JetBrains Mono", monospace; display: flex; gap: 14px; align-items: center; }
  .spark-cap i { display: inline-block; width: 14px; border-top: 2px dashed var(--green); opacity: .7; margin-right: 6px; vertical-align: middle; }
  .game-stat .v.combo { color: var(--pink); }
  @media (max-width: 900px) {
    .grid2 { grid-template-columns: 1fr; }
    .gauge { margin: 0 auto; }
    .grid { grid-template-columns: 1fr; }
    .hero { grid-template-columns: 1fr; }
    .grid3 { grid-template-columns: 1fr; }
    .side { min-width: 0; }
    .anti-stress { right: 16px; bottom: 16px; width: 64px; height: 64px; font-size: 28px; }
    .music-btn { right: 16px; bottom: 92px; width: 56px; height: 56px; font-size: 22px; }
    .music-panel { right: 16px; bottom: 156px; width: 280px; }
    #ytPlayerContainer { left: 16px; bottom: 92px; width: 280px; }
    #gameCanvas { height: 340px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* ===== V7: Дополнительный визуал ===== */
  .vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.6) 100%); mix-blend-mode: multiply; }
  .btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 20px rgba(255,255,255,0); transition: box-shadow .3s ease; pointer-events: none; }
  .btn:hover::after { box-shadow: inset 0 0 20px rgba(255,255,255,.2); }
  /* Весь твой CSS оставь как было, я его не трогаю, чтобы не ломать дизайн */
  :root { --bg: #08020f; --panel: rgba(var(--s3), 0.62); --text: #f6ecff; --muted: #b89ad6; --purple: #b45cff; --purple-2: #d09aff; --purple-3: #f0d8ff; --violet: #8b2fd6; --magenta: #e040fb; --pink: #ff6ec7; --green: #4ade80; --red: #f87171; --radius: 26px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: 40px clamp(16px, 4vw, 64px) 100px; font-family: "Space Grotesk", "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; position: relative; }
  /* ... тут твои стили ... */
  .checkers-wrap { display: flex; flex-direction: column; align-items: center; }
  #checkersBoard { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 100%; max-width: 400px; aspect-ratio: 1; background: rgba(var(--c1),.2); padding: 4px; border-radius: 12px; margin-top: 20px; }
  .cell { position: relative; background: rgba(var(--s1),.8); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .3s; }
  .cell.dark { background: rgba(var(--s0),.8); }
  .cell.selected { box-shadow: inset 0 0 0 3px var(--pink); }
  .piece { width: 70%; height: 70%; border-radius: 50%; transition: transform .3s; }
  .piece.white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); box-shadow: 0 0 15px rgba(255,255,255,.8); }
  .piece.black { background: radial-gradient(circle at 30% 30%, #666, #222); box-shadow: 0 0 15px rgba(0,0,0,.8); }
  .piece.king::after { content: '👑'; position: absolute; font-size: 16px; }
</style>
</head>
<body>

<!-- ... твой HTML (Хедер, Вкладки, Калькулятор, Мини-игра) оставь как было ... -->

<!-- ВКЛАДКА: ШАШКИ (ОБНОВЛЕННАЯ) -->
  <div class="tab-content" id="tab-checkers">
    <section class="card">
      <h2>Шашки</h2>
      
      <div class="toolbar" style="justify-content: center; margin-bottom: 20px;">
        <button class="btn btn-primary" onclick="startOnlineGame()">🌐 Играть онлайн</button>
        <button class="btn btn-ghost" onclick="startLocalGame()">👥 Локально</button>
        <button class="btn btn-ghost" onclick="startAIGame()">🤖 С ИИ</button>
      </div>

      <div class="grid2" style="margin-bottom: 20px;">
          <div class="field">
              <label>Игрок 1 (Белые)</label>
              <input type="text" id="p1Name" value="Игрок 1">
          </div>
          <div class="field">
              <label>Игрок 2 (Чёрные)</label>
              <input type="text" id="p2Name" value="Игрок 2">
          </div>
      </div>

      <div class="checkers-wrap">
          <div id="checkersBoard"></div>
          <div style="text-align:center; margin-top:20px; font-weight:bold; color:var(--purple-2); font-size:1.2rem;" id="checkersStatus">Выбери режим игры</div>
      </div>
      
      <div class="toolbar" style="justify-content:center; margin-top:20px;">
        <button class="btn btn-primary" onclick="initCheckers()">Начать заново</button>
      </div>
    </section>
  </div>

<script>
/* ============ ВЕСЬ ТВОЙ СТАРЫЙ JS (калькулятор, музыка и т.д.) ============ */
// ... он должен остаться ...

/* ============ НОВАЯ ЛОГИКА ШАШЕК (ОНЛАЙН + ИИ + ЛОКАЛКА) ============ */
let socket = null;
let myColor = null;
let currentRoomId = null;
let gameMode = 'local';
let checkersBoard = [];
let selectedCell = null;
let checkersTurn = 'white';

// ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ОТ RENDER!
const SERVER_URL = const SERVER_URL = "https://server-checkers-r1te.onrender.com"

function connectToServer() {
    if (socket) return;
    socket = io(SERVER_URL);

    socket.on('waiting_for_opponent', () => {
        document.getElementById('checkersStatus').textContent = "Ожидание соперника...";
        document.getElementById('checkersStatus').style.color = "var(--pink)";
    });

    socket.on('game_start', (data) => {
        myColor = data.color;
        currentRoomId = data.roomId;
        initCheckers();
        document.getElementById('checkersStatus').textContent = `Игра! Ты: ${myColor === 'white' ? 'Белые' : 'Чёрные'}. Соперник: ${data.opponentName}`;
        document.getElementById('checkersStatus').style.color = "var(--green)";
        checkersTurn = 'white';
        renderCheckers();
    });

    socket.on('opponent_moved', (data) => {
        applyMove(data.from, data.to);
        checkersTurn = myColor;
        renderCheckers();
        document.getElementById('checkersStatus').textContent = "Твой ход!";
    });

    socket.on('opponent_disconnected', () => {
        alert("Соперник отключился.");
        initCheckers();
        document.getElementById('checkersStatus').textContent = "Соперник вышел";
    });
}

function startOnlineGame() {
    gameMode = 'online';
    if (!socket) connectToServer();
    const name = prompt("Твоё имя:") || "Игрок";
    socket.emit('find_game', name);
    document.getElementById('checkersStatus').textContent = "Поиск игры...";
}

function startLocalGame() {
    gameMode = 'local';
    initCheckers();
    document.getElementById('checkersStatus').textContent = "Локальная игра";
}

function startAIGame() {
    gameMode = 'ai';
    initCheckers();
    document.getElementById('checkersStatus').textContent = "Игра с ИИ";
}

function initCheckers() {
  checkersBoard = Array(8).fill(null).map(() => Array(8).fill(null));
  selectedCell = null;
  checkersTurn = 'white';
  
  for(let r=5; r<8; r++) for(let c=0; c<8; c++) if((r+c)%2 !== 0) checkersBoard[r][c] = 'white';
  for(let r=0; r<3; r++) for(let c=0; c<8; c++) if((r+c)%2 !== 0) checkersBoard[r][c] = 'black';
  
  renderCheckers();
}

function renderCheckers() {
  const container = document.getElementById('checkersBoard');
  if(!container) return; // Защита, если вкладка не активна
  container.innerHTML = '';
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r+c)%2 === 0 ? '' : 'dark');
      if(selectedCell && selectedCell.r === r && selectedCell.c === c) cell.classList.add('selected');
      
      const piece = checkersBoard[r][c];
      if(piece) {
        const p = document.createElement('div');
        p.className = 'piece ' + piece.split('-')[0];
        if(piece.includes('king')) p.classList.add('king');
        cell.appendChild(p);
      }
      cell.onclick = () => clickCell(r, c);
      container.appendChild(cell);
    }
  }
}

function applyMove(from, to) {
    const piece = checkersBoard[from.r][from.c];
    if (!piece) return;

    checkersBoard[to.r][to.c] = piece;
    checkersBoard[from.r][from.c] = null;

    if (Math.abs(to.r - from.r) === 2) {
        const mr = from.r + (to.r - from.r) / 2;
        const mc = from.c + (to.c - from.c) / 2;
        checkersBoard[mr][mc] = null;
    }

    if (to.r === 0 && piece.startsWith('black')) checkersBoard[to.r][to.c] += '-king';
    if (to.r === 7 && piece.startsWith('white')) checkersBoard[to.r][to.c] += '-king';
}

function clickCell(r, c) {
    if (gameMode === 'online' && checkersTurn !== myColor) return;

    const piece = checkersBoard[r][c];
    
    if(piece && piece.startsWith(checkersTurn)) {
        selectedCell = {r, c};
        renderCheckers();
        return;
    }
    
    if(selectedCell) {
        const from = selectedCell;
        const dr = r - from.r;
        const dc = c - from.c;
        const pieceType = checkersBoard[from.r][from.c];
        const isKing = pieceType.includes('king');
        let valid = false;

        if(Math.abs(dr) === 1 && Math.abs(dc) === 1 && !piece) {
            if(isKing || (checkersTurn === 'white' && dr === -1) || (checkersTurn === 'black' && dr === 1)) valid = true;
        }
        if(Math.abs(dr) === 2 && Math.abs(dc) === 2 && !piece) {
            const mr = from.r + dr/2, mc = from.c + dc/2;
            const enemy = checkersBoard[mr][mc];
            if(enemy && !enemy.startsWith(checkersTurn)) {
                if(isKing || (checkersTurn === 'white' && dr === -2) || (checkersTurn === 'black' && dr === 2)) valid = true;
            }
        }

        if (valid) {
            applyMove(from, {r, c});
            
            if (gameMode === 'online') {
                socket.emit('make_move', { roomId: currentRoomId, from, to: {r, c} });
            } else if (gameMode === 'ai' && checkersTurn === 'white') {
                setTimeout(makeAIMove, 800);
            }

            checkersTurn = checkersTurn === 'white' ? 'black' : 'white';
            selectedCell = null;
            renderCheckers();
        } else {
            selectedCell = null;
            renderCheckers();
        }
    }
}

function makeAIMove() {
    if (checkersTurn !== 'black' || gameMode !== 'ai') return;

    let validMoves = [];
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const piece = checkersBoard[r][c];
            if (piece && piece.startsWith('black')) {
                const dirs = piece.includes('king') ? [-1, 1] : [1];
                for (const dr of dirs) {
                    for (const dc of [-1, 1]) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !checkersBoard[nr][nc]) {
                            validMoves.push({ from: {r, c}, to: {r: nr, c: nc} });
                        }
                    }
                }
                for (const dr of [-2, 2]) {
                    for (const dc of [-2, 2]) {
                        const nr = r + dr, nc = c + dc;
                        const mr = r + dr/2, mc = c + dc/2;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !checkersBoard[nr][nc]) {
                            const enemy = checkersBoard[mr][mc];
                            if (enemy && enemy.startsWith('white')) {
                                validMoves.push({ from: {r, c}, to: {r: nr, c: nc} });
                            }
                        }
                    }
                }
            }
        }
    }

    if (validMoves.length === 0) return;
    const move = validMoves[Math.floor(Math.random() * validMoves.length)];

    applyMove(move.from, move.to);
    checkersTurn = 'white';
    renderCheckers();
}

// Инициализация при загрузке
window.addEventListener('DOMContentLoaded', () => {
   // ... твоя старая инициализация ...
   initCheckers(); // Инициализируем доску при старте
});
</script>
</body>
</html>
